name: Manual practice publication candidate verification

on:
  push:
    branches: [ci/manual-practice-publication-20261128]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-ci-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f5dcec55b3c9dffb12c5b1790da436dd4f7a089e
          persist-credentials: false
      - name: Verify exact source and deployment contracts
        run: |
          test "$(git rev-parse HEAD)" = "f5dcec55b3c9dffb12c5b1790da436dd4f7a089e"
          python3 -m unittest discover -s deploy/oci/tests -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Apply V044 and verify auto practice on isolated MySQL
        env:
          JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
          LL_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
          LL_TEST_MYSQL_USERNAME: root
          LL_TEST_MYSQL_PASSWORD: synthetic-ci-only
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 databaseIntegrationTest --tests '*AutoPracticePersistenceIntegrationTest*' --tests '*LevelTestPersistenceIntegrationTest*'
          mkdir -p test-results
          cp -r build/test-results/databaseIntegrationTest test-results/level-database
      - name: Build the read-only operating V044 metadata probe
        env:
          METADATA_SOURCE_BASE64: 
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ll-v44-probe/classes"
          printf '%s' "$METADATA_SOURCE_BASE64" | base64 --decode > "$RUNNER_TEMP/ll-v44-probe/LLReleaseMetadata.java"
          javac --release 21 -d "$RUNNER_TEMP/ll-v44-probe/classes" "$RUNNER_TEMP/ll-v44-probe/LLReleaseMetadata.java"
          jar --create --file "$RUNNER_TEMP/ll-v44-probe/ll-release-metadata.jar" -C "$RUNNER_TEMP/ll-v44-probe/classes" .
          java -cp "$RUNNER_TEMP/ll-v44-probe/ll-release-metadata.jar" LLReleaseMetadata rejected > "$RUNNER_TEMP/ll-v44-probe/rejection.log" && exit 1
          grep -F '"ok":false' "$RUNNER_TEMP/ll-v44-probe/rejection.log"
      - uses: actions/upload-artifact@v4
        with:
          name: ll-v44-metadata-tool
          path: |
            ${{ runner.temp }}/ll-v44-probe/ll-release-metadata.jar
            ${{ runner.temp }}/ll-v44-probe/LLReleaseMetadata.java
      - name: Run the existing mandatory persistence regressions
        env:
          JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
          LL_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
          LL_TEST_MYSQL_USERNAME: root
          LL_TEST_MYSQL_PASSWORD: synthetic-ci-only
          LL_TEST_AI_URL: http://127.0.0.1:9
          LL_DELETION_TEST_OUTPUT_DIR: ${{ runner.temp }}/ll-deletion-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p -- "$LL_DELETION_TEST_OUTPUT_DIR"
          ./gradlew --no-daemon --max-workers=1 \
            databaseIntegrationTest --tests '*CuratedWritingStoreIntegrationTest*' \
              --tests '*GrowthPersistenceIntegrationTestEvidenceCollation*' \
              --tests '*AccountDeletionPersistenceIntegrationTest*' \
            writingHttpDatabaseIntegrationTest --tests '*CuratedWritingHttpDatabaseIntegrationTest*'
          cp -r build/test-results/databaseIntegrationTest test-results/persistence
          cp -r build/test-results/writingHttpDatabaseIntegrationTest test-results/http-database
      - name: Compile, run all unit tests, and build the actual runtime image
        run: |
          docker build --platform linux/amd64 --target tested -f deploy/oci/Dockerfile -t local/level-tested:f5dcec55b3c9dffb12c5b1790da436dd4f7a089e .
          container="level-unit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker create --name "$container" local/level-tested:f5dcec55b3c9dffb12c5b1790da436dd4f7a089e
          docker cp "$container:/source/build/test-results/test" test-results/unit
          docker rm "$container"
          trap - EXIT
          docker build --platform linux/amd64 --target runtime -f deploy/oci/Dockerfile -t local/level-runtime:f5dcec55b3c9dffb12c5b1790da436dd4f7a089e .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ll-level-test-results
          path: |
            test-results/
            build/test-results/
