name: Compile the read-only V043 metadata probe
on:
  push:
    branches: [ci/automatic-practice-v43-metadata-20261128]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and confirm rejection before the connection
        env:
          SOURCE: 
        run: |
          set -euo pipefail
          mkdir classes
          printf '%s' "$SOURCE" | base64 --decode > LLReleaseMetadata.java
          javac --release 21 -d classes LLReleaseMetadata.java
          jar --create --file ll-release-metadata.jar -C classes .
          java -cp ll-release-metadata.jar LLReleaseMetadata rejected > rejection.log && exit 1
          grep -F '"ok":false' rejection.log
      - uses: actions/upload-artifact@v4
        with:
          name: ll-v43-metadata-tool
          path: |
            ll-release-metadata.jar
            LLReleaseMetadata.java
