database:
  enabled: true

  jdbcUrl: ${DB_JDBC_URL}
  expectedCatalog: ${DB_EXPECTED_CATALOG:translacat_ll}
  username: ${DB_USERNAME}
  password: ${DB_PASSWORD}

  maximumPoolSize: ${DB_MAX_POOL_SIZE:4}
  minimumIdle: ${DB_MIN_IDLE:0}
  connectionTimeoutMs: ${DB_CONNECTION_TIMEOUT_MS:5000}

  # 별도 배포 migration 작업을 두는 경우, 적용 후 DB_MIGRATION_MODE=validate로 운용한다.
  migrations:
    mode: ${DB_MIGRATION_MODE:validate}

internalApi:
  # 운영 내부 인증은 환경변수로 끄지 않는다.
  enabled: true
  issuer: ${LL_INTERNAL_JWT_ISSUER:translacat-be}
  audience: ${LL_INTERNAL_JWT_AUDIENCE:translacat-ll}
  callerService: ${LL_INTERNAL_CALLER_SERVICE:translacat-be}
  secretBase64: ${LL_INTERNAL_JWT_SECRET_BASE64}
  maxTtlSeconds: ${LL_INTERNAL_JWT_MAX_TTL_SECONDS:120}
  clockSkewSeconds: ${LL_INTERNAL_JWT_CLOCK_SKEW_SECONDS:5}

aiServer:
  url: ${AI_SERVER_URL}
  apiKey: ${AI_SERVER_API_KEY}

levelTest:
  # 제공 중인 레벨 테스트는 운영 설정에서 항상 연결한다.
  enabled: true
  audioUploadBaseUrl: ${LL_LEVEL_TEST_AUDIO_UPLOAD_BASE_URL}
  audioRoot: ${LL_LEVEL_TEST_AUDIO_ROOT:data/level-test-audio}
  aiTimeoutSeconds: ${LL_LEVEL_TEST_AI_TIMEOUT_SECONDS:180}
  aiConcurrency: ${LL_LEVEL_TEST_AI_CONCURRENCY:2}
  prefetchEnabled: ${LL_LEVEL_TEST_PREFETCH_ENABLED:true}

# 운영 기능을 명시적으로 연결한다. LL은 DB 작업 상태를 사용하며 Redis를 만들지 않는다.
growth:
  enabled: true
writing:
  enabled: true
practice:
  enabled: true
  generationTier: SOL
listening:
  enabled: true
speaking:
  enabled: true
  ttsModel: ${LL_SPEAKING_TTS_MODEL}
  audio:
    storage: local
    directory: /app/data/speaking
overview:
  enabled: true
