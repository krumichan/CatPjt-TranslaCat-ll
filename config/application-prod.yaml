database:
  enabled: true

  jdbcUrl: ${DB_JDBC_URL}
  expectedCatalog: ${DB_EXPECTED_CATALOG:translacat_ll}
  username: ${DB_USERNAME}
  password: ${DB_PASSWORD}

  maximumPoolSize: ${DB_MAX_POOL_SIZE:10}
  minimumIdle: ${DB_MIN_IDLE:2}
  connectionTimeoutMs: ${DB_CONNECTION_TIMEOUT_MS:5000}

  # For a separate deployment migration job, set DB_MIGRATION_MODE=validate afterwards.
  migrations:
    mode: ${DB_MIGRATION_MODE:migrate}
